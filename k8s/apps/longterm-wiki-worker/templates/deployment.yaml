apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.name" . }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ include "worker.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "worker.name" . }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 600
      containers:
        - name: worker
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          command:
            {{- toYaml .Values.command | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.envSecret }}
          env:
            - name: WORKER_HEALTH_PORT
              value: {{ .Values.healthPort | quote }}
            - name: NODE_ENV
              value: production
            # Raise the V8 heap cap. The backfill-sources child (spawned via
            # node) inherits this env; on large batches it otherwise hits the
            # ~512MB default heap limit and aborts with "JavaScript heap out of
            # memory". Keep below resources.limits.memory to leave off-heap room.
            - name: NODE_OPTIONS
              value: {{ .Values.nodeOptions | quote }}
            {{- if .Values.llmPayloadCaptureRate }}
            # Sampling rate for LLM request/response payload capture (model-swap
            # eval). Empty/unset = off; "1" = capture every call. The worker makes
            # the bulk of production LLM calls, so it must opt in like the CI
            # pipelines do via the LLM_PAYLOAD_CAPTURE_RATE repo variable.
            - name: LLM_PAYLOAD_CAPTURE_RATE
              value: {{ .Values.llmPayloadCaptureRate | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
