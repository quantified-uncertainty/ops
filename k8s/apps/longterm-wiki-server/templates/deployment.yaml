apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wiki-server.name" . }}
spec:
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ include "wiki-server.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "wiki-server.name" . }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          envFrom:
          - secretRef:
              name: {{ .Values.envSecret }}
          ports:
            - containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.port }}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Allow endpoint removal to reach the ingress before shutdown.
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
